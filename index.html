<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>DOM Events Practice</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h1>DOM Events Practice</h1>

        <!-- Part 1 -->
        <section id="part1">
            <h2>Part 1</h2>
            <button id="greet-btn">Greet Me</button>
            <button id="other-btn">Another Button</button>
            <p id="output">Waiting...</p>
        </section>

        <!-- Part 2 -->
        <section id="part2">
            <h2>Part 2</h2>
            <div id="outer">
                outer
                <div id="inner">
                    inner
                    <button id="deep-btn">Deep Button</button>
                </div>
            </div>
        </section>

        <!-- Part 3 -->
        <section id="part3">
            <h2>Part 3</h2>
            <ul id="task-list">
                <li>Original task one</li>
                <li>Original task two</li>
            </ul>
            <button id="add-task">Add a Task</button>
        </section>

        <!-- Bonus -->
        <section id="bonus">
            <h2>Bonus</h2>
            <form id="signup">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username">
                <button type="submit">Sign Up</button>
            </form>
        </section>

        <script src="script.js"></script>
    </body>
</html>
